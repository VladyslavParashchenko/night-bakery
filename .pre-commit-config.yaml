default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check --ignore-unknown
        language: system
        types: [text]
        stages: [pre-commit]
      - id: eslint
        name: eslint
        entry: npx eslint --no-warn-ignored
        language: system
        files: \.(js|ts|svelte)$
        stages: [pre-commit]
      - id: check
        name: svelte-check
        entry: npm run check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: test
        name: unit tests
        entry: npm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commitlint
        name: commitlint
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
